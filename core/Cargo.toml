[package]
name = "chime-core"
version = "0.2.0"
edition = "2024"
description = "Reads notification badges from the macOS Dock for the Chime menu bar app"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
