# Tests the Rust core and builds the app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Toolchain
        run: swift --version && cargo --version

      - name: Rust tests
        run: make test

      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets --release -- -D warnings

      - name: Build app
        run: make app
